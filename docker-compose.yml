name: guilliman-local

services:
  postgres:
    image: postgres:17-alpine
    container_name: guilliman-postgres
    restart: always
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guilliman_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guilliman_secret}
      POSTGRES_DB: ${POSTGRES_DB:-guilliman_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: guilliman-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
